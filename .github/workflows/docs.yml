name: Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: xcode-27
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - run: sudo xcode-select --switch /Applications/Xcode_27.2.app
      - uses: actions/configure-pages@v6
      - run: >
          swift package
          --allow-writing-to-directory ./docs
          generate-documentation --target Initializable
          --disable-indexing
          --transform-for-static-hosting
          --hosting-base-path Initializable
          --output-path ./docs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v5
